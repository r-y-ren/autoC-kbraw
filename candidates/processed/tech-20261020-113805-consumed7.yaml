- id: arxiv-2610.09872
  kind: hf-paper
  name: 'LiveMACE: Process-Aware Evaluation of LLM Agent Capabilities in Evolving
    Markets'
  published: '2026-10-06'
  urls:
  - https://huggingface.co/papers/2610.09872
  - https://arxiv.org/abs/2610.09872
  signal:
    venue: HuggingFace Papers
    upvotes: 112
    stars: null
    citations_90d: null
    runnable: false
  summary: 'Evaluating agents by outcomes alone can obscure the capabilities that
    produce them. This problem is especially pronounced in evolving environments,
    where outcomes reflect a closed-loop interaction between agent behavior and changing
    external conditions. We introduce LiveMACEBench, a process-aware benchmark that
    uses live financial markets as a naturally evolving testbed for persistent LLM
    agents. '
  suggested_fields:
  - LLM agents
  directions:
