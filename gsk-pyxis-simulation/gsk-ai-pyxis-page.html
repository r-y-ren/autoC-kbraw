                    <rich-text-content :data="{&quot;type&quot;:&quot;rich-text-content&quot;,&quot;text&quot;:&quot;&lt;h3&gt;&lt;strong&gt;&lt;span style=\&quot;color: rgb(255, 255, 255);\&quot;&gt;----&lt;/span&gt;&lt;br&gt;Build an AI agent that manages a simulated pharmaceutical R&amp;amp;D portfolio of drug programs. Decide which drugs to fund, continue or abandon as you compete against rival agents for the same assets and markets.&lt;span class=\&quot;orange\&quot;&gt;&#xA0;&lt;/span&gt;&lt;/strong&gt;&lt;/h3&gt;\n&lt;h3&gt;&lt;span style=\&quot;color: rgb(255, 255, 255);\&quot;&gt;&lt;strong&gt;----&lt;/strong&gt;&lt;/span&gt;&lt;/h3&gt;\n&lt;p&gt;Researchers have so far treated portfolio optimisation and competitive drug development as separate problems: portfolio models ignore competitors, while game-theory models only estimate behaviour from past data. Multi-agent simulation benchmarks have matured substantially in the meantime, but no one has combined all three.&lt;/p&gt;\n&lt;p&gt;In our competition, you will build an AI agent to manage a simulated pharmaceutical R&amp;amp;D portfolio. It will compete head-to-head against other agents. Go bankrupt, and you lose immediately. Survive, and you&#x27;ll be judged on net cash flow in a field where more than 80% of what you fund will fail.&lt;/p&gt;\n&lt;p&gt;You&#x27;ll be working on a problem at the core of a $300 billion-a-year industry. The techniques developed here could extend well beyond pharma, offering a new way to study high-stakes long-horizon decision-making.&lt;/p&gt;&quot;,&quot;isEmbeddedApp&quot;:false}"></rich-text-content>
                    <!-- {"type":"rich-text-content","text":"<h3><strong><span style=\"color: rgb(255, 255, 255);\">----</span><br>Build an AI agent that manages a simulated pharmaceutical R&amp;D portfolio of drug programs. Decide which drugs to fund, continue or abandon as you compete against rival agents for the same assets and markets.<span class=\"orange\"> </span></strong></h3>\n<h3><span style=\"color: rgb(255, 255, 255);\"><strong>----</strong></span></h3>\n<p>Researchers have so far treated portfolio optimisation and competitive drug development as separate problems: portfolio models ignore competitors, while game-theory models only estimate behaviour from past data. Multi-agent simulation benchmarks have matured substantially in the meantime, but no one has combined all three.</p>\n<p>In our competition, you will build an AI agent to manage a simulated pharmaceutical R&amp;D portfolio. It will compete head-to-head against other agents. Go bankrupt, and you lose immediately. Survive, and you'll be judged on net cash flow in a field where more than 80% of what you fund will fail.</p>\n<p>You'll be working on a problem at the core of a $300 billion-a-year industry. The techniques developed here could extend well beyond pharma, offering a new way to study high-stakes long-horizon decision-making.</p>","isEmbeddedApp":false} -->

                    <rich-text-content :data="{&quot;type&quot;:&quot;rich-text-content&quot;,&quot;text&quot;:&quot;&lt;h4&gt;&lt;span style=\&quot;color: rgb(255, 255, 255);\&quot;&gt;----&lt;/span&gt;&lt;/h4&gt;\n&lt;h4&gt;&lt;strong&gt;How to get involved&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;Play against our baseline agents or watch replays of agents competing: &lt;a href=\&quot;https://gsk.ai/pyxis-portfolio-challenge/play/\&quot;&gt;gsk.ai/pyxis-portfolio-challenge/play&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;Head to the competition page on Kaggle to find out how to play, download the starter environment and submit your agent:&amp;nbsp;&lt;a rel=\&quot;noopener\&quot; href=\&quot;https://www.kaggle.com/competitions/gsk-simulation\&quot; target=\&quot;_blank\&quot;&gt;https://www.kaggle.com/competitions/gsk-simulation&lt;/a&gt;&lt;br&gt;&lt;br&gt;&lt;br&gt;&lt;/p&gt;\n&lt;h3&gt;&lt;span style=\&quot;color: rgb(255, 255, 255);\&quot;&gt;&lt;strong&gt;----&lt;/strong&gt;&lt;/span&gt;&lt;/h3&gt;\n&lt;h4&gt;&lt;strong&gt;Timeline&lt;/strong&gt;&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;29 September 2026:&lt;/strong&gt;&amp;nbsp;Competition opens&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;4 January 2027: &lt;/strong&gt;Entry deadline (rules must be accepted to compete) and team merger deadline&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;11 January 2027: &lt;/strong&gt;Final submission deadline&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Games will continue running for roughly two weeks after the deadline to reduce rating uncertainty, followed by a final Bradley-Terry tournament to produce the final leaderboard.&lt;/p&gt;\n&lt;h3&gt;&lt;span style=\&quot;color: rgb(255, 255, 255);\&quot;&gt;&lt;strong&gt;----&lt;/strong&gt;&lt;/span&gt;&lt;/h3&gt;\n&lt;h4&gt;&lt;strong&gt;Prizes&lt;/strong&gt;&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;1st place: &lt;/strong&gt;$15,000&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;2nd place: &lt;/strong&gt;$12,000&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;3rd place: &lt;/strong&gt;$9,000&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;4th place: &lt;/strong&gt;$8,000&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;5th place:&lt;/strong&gt; $6,000&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Non-monetary: &lt;/strong&gt;An invitation to co-author the post-competition proceedings paper.&lt;/p&gt;&quot;,&quot;isEmbeddedApp&quot;:false}"></rich-text-content>
